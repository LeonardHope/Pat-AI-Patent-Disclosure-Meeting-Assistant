[project]
name = "disclosure-meeting-assistant"
version = "0.1.0"
description = "Python sidecar for the Disclosure Meeting Assistant"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "websockets>=14.0",
    "sounddevice>=0.5",
    "numpy>=2.0",
    "scipy>=1.14",
    "onnxruntime>=1.19",
    "silero-vad>=5.1",
    "pywhispercpp>=1.4",
    "anthropic>=0.52",
    "httpx>=0.28",
    "pymupdf>=1.25",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "python-multipart>=0.0.18",
    "pydantic>=2.10",
    "tiktoken>=0.8",
    "llama-cpp-python>=0.3",
]

[tool.hatch.build.targets.wheel]
packages = [
    "audio",
    "transcription",
    "ai",
    "documents",
    "meeting",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
